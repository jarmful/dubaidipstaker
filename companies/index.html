<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompanyCap — Top Companies by Market Cap</title>
<meta name="description" content="Live ranking of the world's largest public companies by market capitalization — prices, daily and weekly change, at a glance.">
<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --up: #006300;
    --up-mark: #0ca30c;
    --down: #d03b3b;
    --accent: #2a78d6;
    --b1:#2a78d6; --b2:#1baf7a; --b3:#eda100; --b4:#008300;
    --b5:#4a3aa7; --b6:#e34948; --b7:#e87ba4; --b8:#eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --up: #0ca30c;
      --up-mark: #0ca30c;
      --down: #d03b3b;
      --accent: #3987e5;
      --b1:#3987e5; --b2:#199e70; --b3:#c98500; --b4:#008300;
      --b5:#9085e9; --b6:#e66767; --b7:#d55181; --b8:#d95926;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .brand { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .brand span { color: var(--accent); }
  .updated { color: var(--muted); font-size: 13px; margin-left: auto; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 14px 0 18px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .tile .label { color: var(--ink-2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tile .sub { font-size: 13px; color: var(--ink-2); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .controls input, .controls select {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font: inherit; font-size: 14px;
  }
  .controls input { flex: 1; min-width: 180px; }
  .controls input:focus, .controls select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .board { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 11px 12px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th.co, td.co { text-align: left; }
  thead th {
    font-size: 12px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--grid);
    cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface);
  }
  thead th[data-sort]:hover { color: var(--ink); }
  thead th .arrow { font-size: 10px; }
  tbody tr { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }

  td.rank { color: var(--muted); font-size: 13px; width: 36px; }
  td.num { font-variant-numeric: tabular-nums; }
  td.cap { font-weight: 700; }

  .co-cell { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700;
  }
  .co-name { font-weight: 600; }
  .co-meta { font-size: 12px; color: var(--muted); }

  .chg { font-weight: 600; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .chg.na { color: var(--muted); font-weight: 400; }

  td.spark { width: 132px; }
  td.spark svg { display: block; margin-left: auto; }

  .foot { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  .foot a { color: var(--accent); }

  .m-cap { display: none; }
  @media (max-width: 720px) {
    .hide-m { display: none; }
    table { min-width: 0; }
    th, td { padding: 10px 5px; }
    th:first-child, td:first-child { padding-left: 10px; }
    th:last-child, td:last-child { padding-right: 10px; }
    td.rank { width: 24px; }
    .chg { font-size: 13px; }
    .tile .value { font-size: 18px; }
    /* CMC-style mobile: market cap moves under the company name */
    .m-cap { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; }
    th.cap-col, td.cap { display: none; }
    .co-meta { display: none; }
    td.co { white-space: normal; width: 100%; }
    .co-name { font-size: 14px; line-height: 1.25; }
    .badge { width: 28px; height: 28px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Company<span>Cap</span></div>
    <div class="updated" id="updated">Loading…</div>
  </header>
  <div style="color:var(--ink-2);font-size:14px">The world's largest public companies, ranked by market capitalization.</div>

  <section class="tiles" id="tiles" aria-label="Market overview"></section>

  <div class="controls">
    <input id="search" type="search" placeholder="Search company, ticker, country…" aria-label="Search companies">
    <select id="sector" aria-label="Filter by sector"><option value="">All sectors</option></select>
  </div>

  <div class="board">
    <table aria-label="Companies ranked by market cap">
      <thead>
        <tr>
          <th data-sort="rank">#</th>
          <th class="co" data-sort="name">Company</th>
          <th class="cap-col" data-sort="marketCapUsd">Market Cap</th>
          <th data-sort="priceUsd">Price</th>
          <th class="hide-m" data-sort="changePct1d">24h %</th>
          <th data-sort="changePct7d">7d %</th>
          <th class="hide-m">Last 7 days</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  let data;
  try {
    data = await (await fetch("data/companies.json", { cache: "no-cache" })).json();
  } catch (e) {
    $("updated").textContent = "Could not load data";
    return;
  }
  const companies = data.companies;

  // ---- formatting helpers ----
  const fmtCap = (v) =>
    v >= 1e12 ? "$" + (v / 1e12).toFixed(2) + " T"
    : v >= 1e9 ? "$" + (v / 1e9).toFixed(0) + " B"
    : "$" + (v / 1e6).toFixed(0) + " M";
  const fmtPrice = (v) => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtChg = (v) => {
    if (v == null) return '<span class="chg na">—</span>';
    const cls = v >= 0 ? "up" : "down";
    const arrow = v >= 0 ? "▲" : "▼";
    return `<span class="chg ${cls}">${arrow} ${Math.abs(v).toFixed(2)}%</span>`;
  };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const BADGE = ["--b1","--b2","--b3","--b4","--b5","--b6","--b7","--b8"];
  const badgeColor = (sym) => {
    let h = 0;
    for (const ch of sym) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return `var(${BADGE[h % 8]})`;
  };
  const initials = (name) => name.replace(/\(.*\)/, "").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();

  function sparkline(row) {
    const pts = row.spark;
    if (!pts || pts.length < 2) return '<span class="chg na">—</span>';
    const w = 120, h = 34, pad = 2;
    const min = Math.min(...pts), max = Math.max(...pts), span = max - min || 1;
    const x = (i) => pad + (i / (pts.length - 1)) * (w - 2 * pad);
    const y = (v) => h - pad - ((v - min) / span) * (h - 2 * pad);
    const line = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const up = pts[pts.length - 1] >= pts[0];
    const color = up ? "var(--up-mark)" : "var(--down)";
    const gid = "g" + row.symbol.replace(/[^A-Za-z0-9]/g, "");
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="7 day price trend, ${up ? "up" : "down"}">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon fill="url(#${gid})" points="${x(0).toFixed(1)},${h - pad} ${line} ${x(pts.length - 1).toFixed(1)},${h - pad}"/>
      <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>
    </svg>`;
  }

  // ---- stat tiles ----
  const total = companies.reduce((s, c) => s + c.marketCapUsd, 0);
  const with7d = companies.filter((c) => c.changePct7d != null);
  const gainer = with7d.length ? with7d.reduce((a, b) => (b.changePct7d > a.changePct7d ? b : a)) : null;
  const loser  = with7d.length ? with7d.reduce((a, b) => (b.changePct7d < a.changePct7d ? b : a)) : null;
  $("tiles").innerHTML = `
    <div class="tile"><div class="label">Total market cap</div><div class="value">${fmtCap(total)}</div><div class="sub">${companies.length} companies</div></div>
    <div class="tile"><div class="label">Largest</div><div class="value">${esc(companies[0].name)}</div><div class="sub">${fmtCap(companies[0].marketCapUsd)}</div></div>
    <div class="tile"><div class="label">Top gainer · 7d</div>${gainer
      ? `<div class="value">${esc(gainer.name)}</div><div class="sub">${fmtChg(gainer.changePct7d)}</div>`
      : `<div class="value">—</div><div class="sub">awaiting live data</div>`}</div>
    <div class="tile"><div class="label">Top loser · 7d</div>${loser
      ? `<div class="value">${esc(loser.name)}</div><div class="sub">${fmtChg(loser.changePct7d)}</div>`
      : `<div class="value">—</div><div class="sub">awaiting live data</div>`}</div>`;

  const when = new Date(data.updated);
  $("updated").textContent = "Updated " + when.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  $("foot").textContent = `Data: ${data.source}. All values in USD. ${data.note || ""}`;

  // ---- filters & sorting ----
  const sectors = [...new Set(companies.map((c) => c.sector))].sort();
  for (const s of sectors) $("sector").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`);

  let sortKey = "rank", sortDir = 1;

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const sec = $("sector").value;
    let rows = companies.filter((c) =>
      (!sec || c.sector === sec) &&
      (!q || (c.name + " " + c.symbol + " " + c.country + " " + c.sector).toLowerCase().includes(q))
    );
    rows = [...rows].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
    });
    $("rows").innerHTML = rows.map((c) => `
      <tr>
        <td class="rank">${c.rank}</td>
        <td class="co"><div class="co-cell">
          <div class="badge" style="background:${badgeColor(c.symbol)}">${initials(c.name)}</div>
          <div><div class="co-name">${esc(c.name)}</div>
          <div class="co-meta">${esc(c.symbol)} · ${esc(c.country)}</div>
          <div class="m-cap">${fmtCap(c.marketCapUsd)}</div></div>
        </div></td>
        <td class="num cap">${fmtCap(c.marketCapUsd)}</td>
        <td class="num">${fmtPrice(c.priceUsd)}</td>
        <td class="hide-m">${fmtChg(c.changePct1d)}</td>
        <td>${fmtChg(c.changePct7d)}</td>
        <td class="spark hide-m">${sparkline(c)}</td>
      </tr>`).join("");

    document.querySelectorAll("thead th[data-sort]").forEach((th) => {
      const base = th.textContent.replace(/[▲▼]\s*$/, "").trim();
      th.innerHTML = th.dataset.sort === sortKey
        ? `${esc(base)} <span class="arrow">${sortDir === 1 ? "▲" : "▼"}</span>` : esc(base);
    });
  }

  document.querySelectorAll("thead th[data-sort]").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = (key === "rank" || key === "name") ? 1 : -1; }
      render();
    });
  });
  $("search").addEventListener("input", render);
  $("sector").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
