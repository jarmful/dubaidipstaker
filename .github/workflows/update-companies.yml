name: Update company market data

on:
  schedule:
    # Weekdays after US market close (21:00 UTC ≈ 16:00 ET) and once
    # European mid-morning, so the site is never more than ~12h stale.
    - cron: "30 21 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest market data
        run: node scripts/update-companies.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies/data/companies.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update company market data"
            git push
          fi
